# Translations. Edit the .arb files in lib/l10n; `flutter gen-l10n` (run by
# `flutter pub get`, `flutter run` and `flutter build`) rewrites lib/l10n/generated.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
