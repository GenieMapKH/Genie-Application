name: Set up Flutter
description: Java, Flutter and dependencies shared by every CI job.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
        cache: gradle

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Get dependencies
      shell: bash
      run: flutter pub get
