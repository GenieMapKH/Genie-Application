name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

  build_and_release:
    name: Build & Release APK
    needs: [analyze, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Send APK to Telegram (with retry for 504 Timeouts)
        uses: Wandalen/wretry.action@v3.1.0
        env:
          INPUT_TO: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INPUT_DOCUMENT: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          INPUT_MESSAGE: |
            🚀 *New Genie App Release!*
            
            *Changelog:*
            ${{ github.event.head_commit.message }}
            
            ✅ *Passed all tests and static analysis!*
        with:
          action: appleboy/telegram-action@master
          attempt_limit: 3
          attempt_delay: 10000
