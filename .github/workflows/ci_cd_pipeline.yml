name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

  build_and_release:
    name: Build & Release APK
    needs: [analyze, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare Telegram Message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          EOF="EOF-$(date +%s)"
          echo "FULL_MESSAGE<<$EOF" >> $GITHUB_ENV
          echo "🚀 *New Genie App Release!*" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "*Changelog:*" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "✅ *Passed all tests and static analysis!*" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Send APK to Telegram (with retry for 504 Timeouts)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MAX_RETRIES=3
          DELAY=10
          
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i to upload APK to Telegram..."
            HTTP_RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "document=@build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
              -F "caption=$FULL_MESSAGE" \
              -F "parse_mode=Markdown" \
              -o response.json)
              
            if [ "$HTTP_RESPONSE" -eq 200 ]; then
              echo "✅ Successfully uploaded APK!"
              cat response.json
              exit 0
            else
              echo "❌ Failed to upload (HTTP $HTTP_RESPONSE)."
              cat response.json || true
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in $DELAY seconds..."
                sleep $DELAY
              else
                echo "All retries failed."
                exit 1
              fi
            fi
          done
