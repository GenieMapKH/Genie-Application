name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

  build_and_release:
    name: Build & Release APK
    needs: [analyze, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare Telegram Message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          EOF="EOF-$(date +%s)"
          echo "FULL_MESSAGE<<$EOF" >> $GITHUB_ENV
          echo "🚀 *New Genie App Release!*" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "*Changelog:*" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "✅ *Passed all tests and static analysis!*" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Send APK to Telegram (with retry for 504 Timeouts)
        uses: Wandalen/wretry.action@v3.1.0
        with:
          action: appleboy/telegram-action@master
          with: >-
            {
              "to": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
              "document": "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk",
              "message": ${{ toJSON(env.FULL_MESSAGE) }}
            }
          attempt_limit: 3
          attempt_delay: 10000
