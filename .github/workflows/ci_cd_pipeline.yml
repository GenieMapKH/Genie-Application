name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Test release notification
        run: bash scripts/test_release_notification.sh

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Code
        run: flutter analyze

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Run Tests
        run: flutter test

  build_and_release:
    name: Build & Release APK
    needs: [analyze, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      # Required: release signing never falls back to a debug key.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A release signed with a throwaway debug key cannot be updated
          # by the next release and is refused by Google Play: stop instead.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to release an APK signed with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # The API server is compiled in; no env file is shipped inside the APK.
      # This workflow publishes production; the gateway is public configuration.
      - name: Build Release APK
        env:
          API_BASE_URL: https://tilomnovgateway.sparkbytekh.com
          # Android Maps key, restricted to this app (see android/app/build.gradle.kts).
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          # Optional: without it the release build reports no errors.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY is not set; the released app would show a blank map."
            exit 1
          fi
          flutter build apk --release --split-per-abi --dart-define=APP_ENV=production --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=SENTRY_ENVIRONMENT=production --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Archive release APK
        uses: actions/upload-artifact@v4
        with:
          name: tilomnov-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Telegram Message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          EOF="EOF-$(date +%s)"
          echo "FULL_MESSAGE<<$EOF" >> $GITHUB_ENV
          echo "🚀 *New Tilomnov App Release!*" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "*Changelog:*" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "✅ *Passed all tests and static analysis!*" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Notify Telegram with APK or artifact link
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify_release.sh
