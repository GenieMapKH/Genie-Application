name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Run Tests
        run: flutter test

  build_and_release:
    name: Build & Release APK
    needs: [analyze, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      # Optional: with these secrets the APK is signed with the release key,
      # otherwise it falls back to the debug key (see android/app/build.gradle.kts).
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A release signed with a throwaway debug key cannot be updated
          # by the next release and is refused by Google Play: stop instead.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to release an APK signed with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # The API server is compiled in; no env file is shipped inside the APK.
      # Without the secret the app uses its built-in default (production).
      - name: Build Release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          # Android Maps key, restricted to this app (see android/app/build.gradle.kts).
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY is not set; the released app would show a blank map."
            exit 1
          fi
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prepare Telegram Message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          EOF="EOF-$(date +%s)"
          echo "FULL_MESSAGE<<$EOF" >> $GITHUB_ENV
          echo "🚀 *New Genie App Release!*" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "*Changelog:*" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "✅ *Passed all tests and static analysis!*" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Send APK to Telegram (with retry for 504 Timeouts)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MAX_RETRIES=3
          DELAY=10

          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i to upload APK to Telegram..."
            HTTP_RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "document=@build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
              -F "caption=$FULL_MESSAGE" \
              -F "parse_mode=Markdown" \
              -o response.json)

            if [ "$HTTP_RESPONSE" -eq 200 ]; then
              echo "✅ Successfully uploaded APK!"
              exit 0
            else
              echo "❌ Failed to upload (HTTP $HTTP_RESPONSE)."
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in $DELAY seconds..."
                sleep $DELAY
              else
                echo "All retries failed."
                exit 1
              fi
            fi
          done
